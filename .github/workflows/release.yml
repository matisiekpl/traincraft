name: Release jar

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build jar
        run: ./gradlew clean jar -Pmod_version="${GITHUB_REF_NAME#v}"

      - name: Name jar after tag
        run: |
          mkdir -p dist
          mv build/libs/tc-*.jar "dist/tc-${GITHUB_REF_NAME}.jar"

      - uses: actions/upload-artifact@v4
        with:
          name: tc-${{ github.ref_name }}
          path: dist/tc-${{ github.ref_name }}.jar
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/tc-${{ github.ref_name }}.jar
          fail_on_unmatched_files: true
